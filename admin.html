<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Dexter Library</title>

<style>
    /* Reset and Core Styling */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    /* Elegant Login Card Box */
    .container {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    /* Header Icons & Titles Layout */
    .admin-icon {
        background: #2c3e50;
        color: #ffffff;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        margin: 0 auto 20px auto;
        box-shadow: 0 4px 10px rgba(44, 62, 80, 0.3);
    }

    h2 {
        margin-bottom: 8px;
        color: #2c3e50;
        font-size: 1.75rem;
        font-weight: 700;
    }

    p.subtitle {
        color: #7f8c8d;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }

    /* Custom Form Layout Inputs */
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: #34495e;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #ccd1d9;
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        background: #fdfefe;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    input:focus {
        border-color: #2c3e50;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.12);
    }

    /* Premium Button Execution */
    button {
        width: 100%;
        padding: 14px;
        background: #2c3e50;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        letter-spacing: 0.5px;
        transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);
    }

    button:hover {
        background: #1a252f;
        box-shadow: 0 6px 15px rgba(44, 62, 80, 0.3);
    }

    button:active {
        transform: scale(0.98);
    }

    /* Mobile Responsive Viewport Overrides */
    @media (max-width: 480px) {
        body {
            background: #ffffff; /* Simplifies look for clean edge-to-edge mobile apps */
            padding: 15px;
        }

        .container {
            box-shadow: none;
            border: none;
            padding: 20px 10px;
            transform: none !important;
        }
        
        input {
            padding: 12px 14px; /* Slightly lower footprint for small displays */
        }
    }
</style>
</head>

<body>

<div class="container">
    <div class="admin-icon">🛡️</div>
    <h2>Admin Portal</h2>
    <p class="subtitle">Secure administrative book configuration access system</p>

    <div class="form-group">
        <label for="email">Admin Email Address</label>
        <input type="email" id="email" placeholder="Enter administrative email">
    </div>
    
    <div class="form-group">
        <label for="password">Security Password</label>
        <input type="password" id="password" placeholder="••••••••••••">
    </div>

    <button onclick="loginAdmin()">Verify Identity & Sign In</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyASE0IKRHGqjHdxOxBovD4n5FqDm_KAukA",
    authDomain: "nalikule-college-books.firebaseapp.com",
    projectId: "nalikule-college-books",
    storageBucket: "nalikule-college-books.appspot.com",
    messagingSenderId: "726295406083",
    appId: "1:726295406083:web:eaf13bfb0bfe59316a1036"
};

// Initialize Instance Connections
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const ADMIN_EMAIL = "gibsondexter34@gmail.com";

function loginAdmin() {
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter both email and password parameters.");
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
    .then(userCredential => {
        if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
            alert("Admin login successful");
            window.location.href = "upload.html";
        } else {
            alert("Security Violation: You are not authorized as an administrative master account.");
            auth.signOut();
        }
    })
    .catch(err => {
        alert(err.message);
    });
}
</script>

</body>
</html>
