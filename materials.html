<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materials</title>
<style>
body { font-family: Arial; background: #f4f6f9; margin: 0; }
header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
.container { width: 90%; max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; }
h2 { text-align: center; }
.material { padding: 15px; margin: 10px 0; background: #f1f3f6; border-left: 5px solid #3498db; border-radius: 8px; }
a { text-decoration: none; color: #2980b9; font-weight: bold; }

/* OVERLAY SHIELD */
#securityOverlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-size: 1.2rem;
    color: #2c3e50;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="securityOverlay">Verifying access permissions...</div>

<header>
    <h1>Course Materials</h1>
</header>

<div class="container">
    <h2 id="title"></h2>
    <div id="materialsList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyASE0IKRHGqjHdxOxBovD4n5FqDm_KAukA",
    authDomain: "nalikule-college-books.firebaseapp.com",
    projectId: "nalikule-college-books",
    storageBucket: "nalikule-college-books.appspot.com",
    messagingSenderId: "726295406083",
    appId: "1:726295406083:web:eaf13bfb0bfe59316a1036"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Grab the registration number directly from local memory
let regNo = localStorage.getItem("userRegNumber");

if (!regNo) {
    alert("❌ No active access session detected. Please fill the verification form.");
    window.location.href = "payment.html";
} else {
    // Start watching their payment status in the background
    startSecurityGuard();
}

function startSecurityGuard() {
    db.collection("payments")
      .where("regNumber", "==", regNo)
      .orderBy("createdAt", "desc")
      .limit(1)
      .onSnapshot((snapshot) => {
          
          if (snapshot.empty) {
              window.location.href = "payment.html";
              return;
          }
          
          let paymentData = snapshot.docs[0].data();
          let currentTime = new Date().getTime();

          // 🚫 1. IF REJECTED -> INSTANT KICK OUT
          if (paymentData.status === "rejected") {
              alert("❌ Your verification details were rejected by the Admin desk.");
              window.location.href = "payment.html";
              return;
          } 
          
          // ⏳ 2. IF PENDING -> ALLOW UNTIL 1.5 HOURS EXPIRE
          else if (paymentData.status === "pending") {
              if (paymentData.createdAt) {
                  let submissionTime = paymentData.createdAt.toDate().getTime();
                  let oneAndHalfHours = 1.5 * 60 * 60 * 1000; // 1 hr 30 mins

                  if (currentTime - submissionTime > oneAndHalfHours) {
                      alert("⏳ Your 1.5-hour grace window has expired. Please wait for Admin approval.");
                      window.location.href = "payment.html";
                      return;
                  }
              }
          }
          
          // ⏱️ 3. IF APPROVED -> ALLOW UNTIL 48 HOURS EXPIRE
          else if (paymentData.status === "approved") {
              if (paymentData.approvedAt) {
                  let approvalTime = paymentData.approvedAt.toDate().getTime();
                  let fortyEightHours = 48 * 60 * 60 * 1000;

                  if (currentTime - approvalTime > fortyEightHours) {
                      alert("🔒 Your 48-hour access token has expired.");
                      window.location.href = "payment.html";
                      return;
                  }
              }
          }

          // Everything checks out! Pull down the curtain and render the layout
          document.getElementById("securityOverlay").style.display = "none";
          setupTitle();
          loadMaterials();
      }, (error) => {
          console.log("Security error: ", error);
          // If Firestore index isn't built yet, let them read data anyway as a backup
          document.getElementById("securityOverlay").style.display = "none";
          setupTitle();
          loadMaterials();
      });
}

// RENDER SYSTEM TITLES
function setupTitle() {
    let system = localStorage.getItem("system");
    let title = document.getElementById("title");
    if (!system) { title.innerText = "⚠ No selection made"; return; }

    if(system === "primary") {
        title.innerText = "📚 " + localStorage.getItem("std");
    } else if(system === "secondary") {
        title.innerText = "📚 " + localStorage.getItem("form");
    } else {
        title.innerText = `📚 ${localStorage.getItem("program")} | ${localStorage.getItem("year")} | ${localStorage.getItem("semester")}`;
    }
}

// LOAD MATERIALS LIST
function loadMaterials() {
    let system = localStorage.getItem("system");
    let container = document.getElementById("materialsList");
    container.innerHTML = "<p>⏳ Loading materials...</p>";

    let query;
    if(system === "primary") {
        query = db.collection("primary_materials").where("std", "==", localStorage.getItem("std"));
    } else if(system === "secondary") {
        query = db.collection("secondary_materials").where("form", "==", localStorage.getItem("form"));
    } else {
        query = db.collection("materials")
                  .where("program", "==", localStorage.getItem("program"))
                  .where("year", "==", localStorage.getItem("year"))
                  .where("semester", "==", localStorage.getItem("semester"));
    }

    query.get().then(snapshot => {
        container.innerHTML = "";
        if (snapshot.empty) {
            container.innerHTML = "<p>❌ No materials found.</p>";
            return;
        }

        snapshot.forEach(doc => {
            let data = doc.data();
            let link = data.link || "";
            let icon = "📄";

            if (link.includes(".pdf")) icon = "📕";
            else if (link.includes(".ppt") || link.includes(".pptx")) icon = "📊";
            else if (link.includes(".jpg") || link.includes(".png")) icon = "🖼️";

            let div = document.createElement("div");
            div.className = "material";
            div.innerHTML = `
                <strong>${icon} ${data.title}</strong><br>
                <a href="${link}" target="_blank">Open / Download</a>
            `;
            container.appendChild(div);
        });
    }).catch(error => {
        container.innerHTML = "<p>⚠ Error loading materials</p>";
    });
}
</script>
</body>
</html>
