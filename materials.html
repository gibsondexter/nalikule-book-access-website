<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materials</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f9;
    margin: 0;
}

header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 800px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

.material {
    padding: 15px;
    margin: 10px 0;
    background: #f1f3f6;
    border-left: 5px solid #3498db;
    border-radius: 8px;
}

a {
    text-decoration: none;
    color: #2980b9;
    font-weight: bold;
}

/* 🔐 SECURITY GUARD SCREEN MODAL OVERLAY */
#securityOverlay {
    position: fixed;
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    font-size: 1.2rem;
    color: #2c3e50;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- 🔒 Temporary barrier while checking permission parameters -->
<div id="securityOverlay">Verifying access authentication permissions...</div>

<header>
    <h1>Course Materials</h1>
</header>

<div class="container">

    <h2 id="title">📚 Loading View...</h2>

    <div id="materialsList"></div>

</div>

<!-- FIREBASE (Added SDK Compat packages for Auth and Database) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyASE0IKRHGqjHdxOxBovD4n5FqDm_KAukA",
    authDomain: "nalikule-college-books.firebaseapp.com",
    projectId: "nalikule-college-books",
    storageBucket: "nalikule-college-books.appspot.com",
    messagingSenderId: "726295406083",
    appId: "1:726295406083:web:eaf13bfb0bfe59316a1036"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth(); // Target Auth instantiation

// 📥 RUN PRIVILEGE VERIFICATION LIVE CHECKS ON STATE CHANGE
auth.onAuthStateChanged((user) => {
    if (!user) {
        alert("🔒 Please log in to view library documents.");
        window.location.href = "index.html";
        return;
    }

    // Step A: Find the user's registration identifier profile
    db.collection("students").doc(user.uid).get().then(studentDoc => {
        if (!studentDoc.exists) {
            alert("❌ Student profile record missing from system repository.");
            window.location.href = "index.html";
            return;
        }

        let regNo = studentDoc.data().regNumber;

        // Step B: Connect a Live background listener to watch for status changes instantly
        db.collection("payments")
          .where("regNumber", "==", regNo)
          .orderBy("createdAt", "desc")
          .limit(1)
          .onSnapshot((snapshot) => {
              
              if (snapshot.empty) {
                  alert("❌ No transaction records identified. Redirecting to payment portal...");
                  window.location.href = "payment.html";
                  return;
              }
              
              let paymentData = snapshot.docs[0].data();
              let currentTime = new Date().getTime();

              // 🚫 LAYER 1: IF REJECTED
              if (paymentData.status === "rejected") {
                  alert("❌ Access Denied: Your registration was rejected by the admin panel.");
                  window.location.href = "payment.html";
                  return;
              } 
              
              // ⏳ LAYER 2: IF PENDING (Check 1-Hour Grace Window Limit)
              else if (paymentData.status === "pending") {
                  let submissionTime = paymentData.createdAt.toDate().getTime();
                  let oneHour = 1 * 60 * 60 * 1000; // 1 Hour equation metric

                  if (currentTime - submissionTime > oneHour) {
                      alert("⏳ Grace window expired! Your 1-hour temporary viewing window has closed.");
                      window.location.href = "payment.html";
                      return;
                  }
              }
              
              // ⏱️ LAYER 3: IF APPROVED (Check 48-Hour Clear Token Window Limit)
              else if (paymentData.status === "approved") {
                  if (paymentData.approvedAt) {
                      let approvalTime = paymentData.approvedAt.toDate().getTime();
                      let fortyEightHours = 48 * 60 * 60 * 1000;

                      if (currentTime - approvalTime > fortyEightHours) {
                          alert("🔒 Your 48-hour access token timeframe has ended. Please renew subscription clearance.");
                          window.location.href = "payment.html";
                          return;
                      }
                  } else {
                      window.location.href = "payment.html";
                      return;
                  }
              }

              // 🎉 CRITERIA MET: Remove curtain shield, run headers, extract assets
              document.getElementById("securityOverlay").style.display = "none";
              setupHeaderTitle();
              loadMaterials();

          }, (error) => {
              console.error("Live listener pipeline execution failure:", error);
              // Handle index errors or missing parameters gracefully
              alert("Configuration connection processing error. Please contact administrative support.");
          });
    });
});

// 📌 RENDER SCREEN HEADER
function setupHeaderTitle() {
    let system = localStorage.getItem("system");
    let title = document.getElementById("title");

    if (!system) {
        title.innerText = "⚠ No selection made";
        return;
    }

    if(system === "primary") {
        let std = localStorage.getItem("std");
        title.innerText = "📚 " + std;
    } 
    else if(system === "secondary") {
        let form = localStorage.getItem("form");
        title.innerText = "📚 " + form;
    } 
    else {
        let program = localStorage.getItem("program");
        let year = localStorage.getItem("year");
        let semester = localStorage.getItem("semester");
        title.innerText = `📚 ${program} | ${year} | ${semester}`;
    }
}

// 📦 LOAD MATERIALS FROM COLLECTION ARRAYS
function loadMaterials() {
    let system = localStorage.getItem("system");
    let container = document.getElementById("materialsList");

    container.innerHTML = "<p>⏳ Loading materials...</p>";
    let query;

    if(system === "primary") {
        let std = localStorage.getItem("std");
        query = db.collection("primary_materials").where("std", "==", std);
    }
    else if(system === "secondary") {
        let form = localStorage.getItem("form");
        query = db.collection("secondary_materials").where("form", "==", form);
    }
    else {
        let program = localStorage.getItem("program");
        let year = localStorage.getItem("year");
        let semester = localStorage.getItem("semester");

        query = db.collection("materials")
                  .where("program", "==", program)
                  .where("year", "==", year)
                  .where("semester", "==", semester);
    }

    // 🔥 EXECUTE QUERY INTERFACE
    query.get()
    .then(snapshot => {
        container.innerHTML = "";

        if (snapshot.empty) {
            container.innerHTML = "<p>❌ No materials found for your section selection.</p>";
            return;
        }

        snapshot.forEach(doc => {
            let data = doc.data();
            let link = data.link || "";
            let icon = "📄";

            if (link.includes(".pdf")) icon = "📕";
            else if (link.includes(".ppt") || link.includes(".pptx")) icon = "📊";
            else if (link.includes(".jpg") || link.includes(".png")) icon = "🖼️";

            let div = document.createElement("div");
            div.className = "material";

            div.innerHTML = `
                <strong>${icon} ${data.title}</strong><br>
                <a href="${link}" target="_blank">Open / Download</a>
            `;
            container.appendChild(div);
        });
    })
    .catch(error => {
        container.innerHTML = "<p>⚠ Error loading materials database references.</p>";
        console.log(error);
    });
}
</script>

</body>
</html>
