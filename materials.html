<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Materials</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f6f9;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header {
        background: #2c3e50;
        color: white;
        padding: 20px 15px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
        font-size: 1.5rem;
        font-weight: 600;
    }

    .main-content {
        flex: 1;
        padding: 20px;
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .container {
        width: 100%;
        max-width: 800px;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 25px;
        font-size: 1.4rem;
        border-bottom: 2px solid #f4f6f9;
        padding-bottom: 10px;
    }

    #materialsList {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .material {
        padding: 15px 20px;
        background: #f8fafc;
        border-left: 5px solid #3498db;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: transform 0.2s, box-shadow 0.2s;
        border: 1px solid #e2e8f0;
        border-left-width: 5px;
    }

    .material:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .material-info {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        font-weight: 500;
        color: #334155;
    }

    .material-icon {
        font-size: 1.4rem;
    }

    a {
        text-decoration: none;
        color: #fff;
        background: #3498db;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 600;
        transition: background 0.2s;
    }

    a:hover {
        background: #2980b9;
    }

    /* Screen block layer during verification check */
    #securityOverlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-size: 1.2rem;
        color: #2c3e50;
        font-weight: bold;
    }

    footer {
        background-color: #002147;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        padding: 15px;
        font-size: 0.85rem;
        margin-top: auto;
    }

    /* 100% Mobile Fluidity Layout */
    @media (max-width: 600px) {
        .main-content { padding: 12px; }
        .container { padding: 15px; box-shadow: none; border: 1px solid #e1e4e8; }
        .material { flex-direction: column; align-items: flex-start; gap: 12px; }
        a { width: 100%; text-align: center; }
    }
</style>
</head>

<body>

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// 🛡️ DYNAMIC LIVE REDIRECTION GUARD
auth.onAuthStateChanged((user) => {
    if (!user) {
        window.location.href = "index.html";
        return;
    }

    // Step 1: Find student data profile entry
    db.collection("students").doc(user.uid).get().then(studentDoc => {
        if (!studentDoc.exists) {
            alert("Profile entry record missing.");
            window.location.href = "index.html";
            return;
        }

        let regNo = studentDoc.data().regNumber;

        // Step 2: Establish a Real-time Listener on their payments history timeline
        db.collection("payments")
          .where("regNumber", "==", regNo)
          .orderBy("createdAt", "desc")
          .limit(1)
          .onSnapshot((snapshot) => {
              
              if (snapshot.empty) {
                  alert("❌ No transaction entry on file. Redirecting to payment portal...");
                  window.location.href = "payment.html"; // Adjust to match your payment filename
                  return;
              }
              
              let paymentData = snapshot.docs[0].data();
              let currentTime = new Date().getTime();

              // 🚫 CASE 1: ADMIN REJECTED TRANSACTION
              if (paymentData.status === "rejected") {
                  alert("❌ Access Denied: Your verification reference data was rejected by the Admin desk.");
                  window.location.href = "payment.html";
                  return;
              } 
              
              // ⏳ CASE 2: PENDING REVIEWS (2-HOUR LIMIT FORCE EXPIRE)
              else if (paymentData.status === "pending") {
                  let submissionTime = paymentData.createdAt.toDate().getTime();
                  let twoHours = 2 * 60 * 60 * 1000;

                  if (currentTime - submissionTime > twoHours) {
                      alert("⏳ Grace window expired! Your 2-hour temporary viewing window closed before Admin authorization confirmation.");
                      window.location.href = "payment.html";
                      return;
                  }
              }
              
              // ⏱️ CASE 3: APPROVED ACCESS TOKEN (48-HOUR FORCE EXPIRE)
              else if (paymentData.status === "approved") {
                  if (paymentData.approvedAt) {
                      let approvalTime = paymentData.approvedAt.toDate().getTime();
                      let fortyEightHours = 48 * 60 * 60 * 1000;

                      if (currentTime - approvalTime > fortyEightHours) {
                          alert("🔒 Your 48-hour access token timeframe has ended. Please renew subscription clearance.");
                          window.location.href = "payment.html";
                          return;
                      }
                  } else {
                      // Safety fallback if field is missing
                      window.location.href = "payment.html";
                      return;
                  }
              }

              // All pass clear checks! Drop the layer shield down and launch layout process
              document.getElementById("securityOverlay").style.display = "none";
              setupTitle();
              loadMaterials();
          }, (error) => {
              console.error("Live monitoring exception caught: ", error);
          });
    });
});

// LOAD USER CHOICE HEADERS
function setupTitle() {
    let system = localStorage.getItem("system");
    let title = document.getElementById("title");

    if (!system) {
        title.innerText = "⚠ No academic layout selection discovered";
        return;
    }

    if(system === "primary") {
        title.innerText = "📚 " + localStorage.getItem("std");
    } else if(system === "secondary") {
        title.innerText = "📚 " + localStorage.getItem("form");
    } else {
        let program = localStorage.getItem("program");
        let year = localStorage.getItem("year");
        let semester = localStorage.getItem("semester");
        title.innerText = `📚 ${program} | ${year} | ${semester}`;
    }
}
