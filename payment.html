<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Payment Portal</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f6f9;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header {
        background: #2c3e50;
        color: white;
        text-align: center;
        padding: 20px 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
        font-size: 1.5rem;
        font-weight: 600;
    }

    .main-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        width: 100%;
    }

    .container {
        width: 100%;
        max-width: 480px;
        background: white;
        padding: 30px 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    /* Beautiful Info Area */
    .info {
        background: #fdfefe;
        border: 1px solid #e1e8ed;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .info h3 {
        color: #2c3e50;
        margin-bottom: 12px;
        font-size: 1.1rem;
        border-bottom: 2px solid #f4f6f9;
        padding-bottom: 5px;
    }

    .info p {
        font-size: 0.95rem;
        margin: 8px 0;
        display: flex;
        justify-content: space-between;
    }

    .amount-tag {
        font-size: 1.2rem;
        color: #27ae60;
        font-weight: bold;
    }

    /* Mobile Money Branding colors */
    .airtel { color: #e74c3c; font-weight: bold; }
    .mpamba { color: #2980b9; font-weight: bold; }

    /* Inputs & Form layout */
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ccd1d9;
        border-radius: 6px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
        border-color: #27ae60;
        box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15);
    }

    button {
        width: 100%;
        padding: 14px;
        background: #27ae60;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s, transform 0.1s;
    }

    button:hover {
        background: #219653;
    }

    button:active {
        transform: scale(0.99);
    }

    /* Loading Overlay Screen */
    #loadingScreen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #f4f6f9;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-size: 1.2rem;
        color: #2c3e50;
    }

    footer {
        background-color: #002147;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        padding: 15px;
        font-size: 0.85rem;
        margin-top: auto;
    }

    /* Perfect 100% Mobile View Adjustments */
    @media (max-width: 480px) {
        .main-content {
            padding: 12px;
            align-items: flex-start;
        }
        .container {
            padding: 20px 15px;
            box-shadow: none;
            border: 1px solid #e1e4e8;
        }
    }
</style>
</head>

<body>

<div id="loadingScreen">Checking access status...</div>

<header>
    <h1>Student Payment Portal</h1>
</header>

<main class="main-content">
    <div class="container">

        <div class="info">
            <h3>Payment Instructions</h3>
            <p><span>Registration Amount:</span> <span class="amount-tag">K50</span></p>
            <p><span>Airtel Money No:</span> <span class="airtel">0991744801</span></p>
            <p><span>TNM Mpamba No:</span> <span class="mpamba">0881744801</span></p>
            <p><span>Reference Note:</span> <strong>Your Reg Number</strong></p>
        </div>

        <div class="form-group">
            <input type="text" id="name" placeholder="Full Name">
            <input type="text" id="regNumber" placeholder="Registration Number">
            <input type="text" id="transactionId" placeholder="Transaction ID / Message">

            <button onclick="submitPayment()">Submit Verification Details</button>
        </div>

    </div>
</main>

<footer>
    <p>© 2026 DEXTER-LIBRARY | Developed by Dexter</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyASE0IKRHGqjHdxOxBovD4n5FqDm_KAukA",
  authDomain: "nalikule-college-books.firebaseapp.com",
  projectId: "nalikule-college-books",
  storageBucket: "nalikule-college-books.appspot.com",
  messagingSenderId: "726295406083",
  appId: "1:726295406083:web:d0b732575478cbf66a1036"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// 🛡️ SECURITY STEP: VERIFY STATUS ON LOAD
auth.onAuthStateChanged((user) => {
    if (!user) {
        // No user authenticated? Send back to login layout
        alert("Please log in first.");
        window.location.href = "index.html"; 
        return;
    }

    // Step 1: Look up current student details to fetch registration number
    db.collection("students").doc(user.uid).get()
    .then((studentDoc) => {
        if (!studentDoc.exists) {
            hideLoading();
            return;
        }

        let regNo = studentDoc.data().regNumber;
        // Autofill inputs for slicker mobile user experience
        document.getElementById("name").value = `${studentDoc.data().firstName} ${studentDoc.data().lastName}`;
        document.getElementById("regNumber").value = regNo;

        // Step 2: Query payments collection to verify if they have an active registration
        return db.collection("payments")
            .where("regNumber", "==", regNo)
            .where("status", "==", "approved")
            .get();
    })
    .then((paymentQuery) => {
        if (paymentQuery && !paymentQuery.empty) {
            let activePaymentFound = false;

            paymentQuery.forEach((doc) => {
                let data = doc.data();
                
                if (data.approvedAt) {
                    let approvedTime = data.approvedAt.toDate().getTime();
                    let currentTime = new Date().getTime();
                    
                    // ⏱️ 48-Hour Milliseconds Calculation Formula: (48hrs * 60mins * 60secs * 1000ms)
                    let fortyEightHours = 48 * 60 * 60 * 1000;

                    if (currentTime - approvedTime < fortyEightHours) {
                        activePaymentFound = true;
                    }
                }
            });

            if (activePaymentFound) {
                // Access window open! Bypass form layout directly 
                window.location.href = "materials.html";
                return;
            }
        }
        hideLoading();
    })
    .catch((err) => {
        console.error("Error processing validation routing: ", err);
        hideLoading();
    });
});

function hideLoading() {
    document.getElementById("loadingScreen").style.display = "none";
}

// 🚀 SUBMIT DATA PROCESSOR
function submitPayment() {
    let name = document.getElementById("name").value.trim();
    let regNumber = document.getElementById("regNumber").value.trim();
    let transactionId = document.getElementById("transactionId").value.trim().toUpperCase();

    if (!name || !regNumber || !transactionId) {
        alert("Please fill all fields completely");
        return;
    }

    const docRef = db.collection("payments").doc(transactionId);

    docRef.get().then((doc) => {
        if (doc.exists) {
            alert("❌ This Transaction Reference Key has already been captured.");
            return;
        }

        // Send payment data for admin manual approval desk
        docRef.set({
            name: name,
            regNumber: regNumber,
            transactionId: transactionId,
            status: "pending", // Changes to "approved" via your admin portal panel
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            approvedAt: null // Will be updated by Admin with serverTimestamp() upon authorization
        })
        .then(() => {
            alert("✅ Payment submitted successfully! Awaiting administrator approval desk verification.");
            window.location.href = "dashboard.html";
        });
    });
}
</script>

</body>
</html>
